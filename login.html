<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sign in · MediCare AI</title><link rel='stylesheet' href='/styles.css'></head><body class='login'><div class='login-card'><div class='brand big'>✚ <span>MediCare <b>AI</b></span></div><h1>Secure patient workspace</h1><p>Sign in with your email. We'll send a one-time verification code.</p><form id='loginForm'><input id='email' type='email' placeholder='you@example.com' autocomplete='username webauthn' required><input id='code' class='hidden' inputmode='numeric' placeholder='6-digit code'><button>Continue</button></form><div id='msg'></div><small>Demo app for educational use. Not a substitute for professional medical advice.</small></div><script>const A=window.hatchable.auth;let step=0;const f=document.getElementById('loginForm');f.onsubmit=async e=>{e.preventDefault();const email=document.getElementById('email').value,msg=document.getElementById('msg');try{if(!step){await A.startLogin({email});step=1;document.getElementById('code').classList.remove('hidden');document.querySelector('button').textContent='Verify code';msg.textContent='Check your email for the code.'}else{await A.verifyCode({email,code:document.getElementById('code').value});location.href='/';}}catch(x){msg.textContent=x.message||'Unable to sign in.'}}</script></body></html>
