[auth]
enabled = true
providers = ["email"]

[ai]
required = true
description = "AI assistant for medication schedule drafting and patient-safe explanations."

[[secret]]
name = "TWILIO_ACCOUNT_SID"
provider = "twilio"
required = true
description = "Twilio Account SID for medicine reminder SMS."

[[secret]]
name = "TWILIO_AUTH_TOKEN"
provider = "twilio"
required = true
description = "Twilio Auth Token for medicine reminder SMS."

[[secret]]
name = "TWILIO_FROM_NUMBER"
provider = "twilio"
required = true
description = "Twilio SMS-enabled sender number in E.164 format."

[db.tables.patients]
read = "own"
write = "own"

[db.tables.prescriptions]
read = "own"
write = "own"

[db.tables.reminders]
read = "own"
write = "own"

[db.tables.sms_logs]
read = "own"
write = "own"